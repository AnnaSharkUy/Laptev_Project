name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  check:
    name: Syntax & structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check files
        run: |
          test -f OnePiece_Geography_Game.py
          test -f game.b64
          test -f start.bat
          test -f README.txt
          test -d music
          test -d animation
          echo OK
      - name: Validate game
        run: |
          python - <<'PY'
          import pathlib, zlib, base64, sys
          main = pathlib.Path("OnePiece_Geography_Game.py").read_text(encoding="utf-8")
          for t in ["One Piece: География Великого Моря", "Владимир Лаптев", "Воронцов Николай Витальевич"]:
              if t not in main:
                  print("Missing", t)
                  sys.exit(1)
          b64 = pathlib.Path("game.b64").read_text(encoding="ascii").strip()
          game = zlib.decompress(base64.b64decode(b64)).decode("utf-8")
          if "LEVELS" not in game or "Глава 1" not in game:
              print("Bad payload")
              sys.exit(1)
          compile(game, "<game>", "exec")
          print("CI OK")
          PY
