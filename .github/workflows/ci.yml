name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  check:
    name: Syntax & structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check required files exist
        run: |
          test -f OnePunch_Geography_Game.py
          test -f start.bat
          test -f README.txt
          test -d music
          test -d animation
          echo "All required files and folders are present."

      - name: Python syntax check
        run: |
          python -m py_compile OnePunch_Geography_Game.py
          echo "Syntax OK"

      - name: Validate header and game payload
        run: |
          python - <<'PY'
          import re
          import sys
          import zlib
          import base64

          with open("OnePunch_Geography_Game.py", encoding="utf-8") as f:
              source = f.read()

          required = [
              "One-Punch Man: Географический Герой",
              "Игра для подготовки к ВПР по географии 6 класс",
              "Владимир Лаптев",
              "Дима Пикулин",
              "Ярослав Костюков",
              "Воронцов Николай Витальевич",
          ]
          for text in required:
              if text not in source:
                  print(f"Missing in header: {text}")
                  sys.exit(1)

          m = re.search(r"b64decode\('([^']+)'\)", source)
          if not m:
              print("Compressed game payload not found")
              sys.exit(1)

          game = zlib.decompress(base64.b64decode(m.group(1))).decode("utf-8")
          if "LEVELS" not in game:
              print("LEVELS not found in decompressed game")
              sys.exit(1)
          if game.count('"name": "Уровень') < 3 and game.count("Уровень 1") < 1:
              # soft check: three levels mentioned
              if "Уровень 1" not in game or "Уровень 2" not in game or "Уровень 3" not in game:
                  print("Expected 3 levels in game data")
                  sys.exit(1)

          compile(game, "<game>", "exec")
          print("Header OK")
          print("Decompressed game compiles")
          print("CI checks passed.")
          PY

      - name: Optional pygame install (for sound support note)
        run: |
          pip install pygame || true
          python -c "import pygame; print('pygame', pygame.version.ver)" || echo "pygame optional — OK without it"
